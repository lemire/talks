<svg width="1200" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- First Chart: Instructions -->
  <!-- Title -->
  <text x="200" y="25" font-family="Arial" font-size="22" text-anchor="middle">Instructions</text>

  <!-- Axes -->
  <line x1="40" y1="300" x2="360" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="40" y1="50" x2="40" y2="300" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="25" y="50" font-family="Arial" font-size="16" text-anchor="end">25</text>
  <text x="25" y="125" font-family="Arial" font-size="16" text-anchor="end">15</text>
  <text x="25" y="225" font-family="Arial" font-size="16" text-anchor="end">5</text>
  <text x="25" y="300" font-family="Arial" font-size="16" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="150" y="320" font-family="Arial" font-size="16" text-anchor="middle">Standard</text>
  <text x="250" y="320" font-family="Arial" font-size="16" text-anchor="middle">Batched (2)</text>

  <!-- Bars for Instructions -->
  <rect x="130" y="100" width="60" height="200" fill="#1f77b4"/>
  <rect x="230" y="150" width="60" height="150" fill="#ff7f0e"/>

  <!-- Second Chart: Instructions per Cycle -->
  <!-- Title -->
  <text x="600" y="25" font-family="Arial" font-size="22" text-anchor="middle">Instructions per cycle</text>

  <!-- Axes -->
  <line x1="440" y1="300" x2="760" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="440" y1="50" x2="440" y2="300" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="425" y="50" font-family="Arial" font-size="16" text-anchor="end">6</text>
  <text x="425" y="125" font-family="Arial" font-size="16" text-anchor="end">4</text>
  <text x="425" y="225" font-family="Arial" font-size="16" text-anchor="end">2</text>
  <text x="425" y="300" font-family="Arial" font-size="16" text-anchor="end">0</text>

  <!-- Bars for Instructions per Cycle -->
  <rect x="530" y="124" width="60" height="176" fill="#1f77b4"/>
  <rect x="630" y="84" width="60" height="216" fill="#ff7f0e"/>

  <!-- Third Chart: Cycles -->
  <!-- Title -->
  <text x="1000" y="25" font-family="Arial" font-size="22" text-anchor="middle">Cycles</text>

  <!-- Axes -->
  <line x1="840" y1="300" x2="1160" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="840" y1="50" x2="840" y2="300" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="825" y="50" font-family="Arial" font-size="16" text-anchor="end">6</text>
  <text x="825" y="125" font-family="Arial" font-size="16" text-anchor="end">4</text>
  <text x="825" y="225" font-family="Arial" font-size="16" text-anchor="end">2</text>
  <text x="825" y="300" font-family="Arial" font-size="16" text-anchor="end">0</text>


  <!-- Bars for Cycles -->
  <rect x="930" y="112" width="60" height="188" fill="#1f77b4"/>
  <rect x="1030" y="181" width="60" height="119" fill="#ff7f0e"/>
</svg>
