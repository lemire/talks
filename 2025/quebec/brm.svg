<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="300" y="25" font-family="Arial" font-size="22" text-anchor="middle">Branch misses</text>

  <!-- Axes -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#000" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="350" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="35" y="50" font-family="Arial" font-size="16" text-anchor="end">50%</text>
  <text x="35" y="150" font-family="Arial" font-size="16" text-anchor="end">30%</text>
  <text x="35" y="250" font-family="Arial" font-size="16" text-anchor="end">10%</text>
  <text x="35" y="350" font-family="Arial" font-size="16" text-anchor="end">0%</text>

  <!-- X-axis labels -->
  <text x="100" y="370" font-family="Arial" font-size="16" text-anchor="middle">4096</text>
  <text x="180" y="370" font-family="Arial" font-size="16" text-anchor="middle">8192</text>
  <text x="260" y="370" font-family="Arial" font-size="16" text-anchor="middle">16384</text>
  <text x="340" y="370" font-family="Arial" font-size="16" text-anchor="middle">32768</text>
  <text x="420" y="370" font-family="Arial" font-size="16" text-anchor="middle">65536</text>
  <text x="500" y="370" font-family="Arial" font-size="16" text-anchor="middle">524288</text>

  <!-- Bars for Branch Misses -->
  <rect x="80" y="346" width="40" height="4" fill="#1f77b4"/>
  <rect x="160" y="342" width="40" height="8" fill="#1f77b4"/>
  <rect x="240" y="294" width="40" height="56" fill="#1f77b4"/>
  <rect x="320" y="149" width="40" height="201" fill="#1f77b4"/>
  <rect x="400" y="109" width="40" height="241" fill="#1f77b4"/>
  <rect x="480" y="86" width="40" height="264" fill="#1f77b4"/>
</svg>
