<svg width="850" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#e6f3fa"/>

  <!-- Title -->
  <text x="400" y="20" font-family="Arial" font-size="20" text-anchor="middle" fill="#2c3e50">ASCII processing flow</text>

  <!-- First Row: ASCII Numbers -->
  <text x="50" y="70" font-family="Arial" font-size="16" fill="#2c3e50">ASCII numbers</text>
  <rect x="50" y="80" width="80" height="40" fill="#a3bef0" stroke="#2c3e50" stroke-width="2"/>
  <text x="90" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0</text>
  <rect x="150" y="80" width="80" height="40" fill="#a3bef0" stroke="#2c3e50" stroke-width="2"/>
  <text x="190" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">1</text>
  <rect x="250" y="80" width="80" height="40" fill="#a3bef0" stroke="#2c3e50" stroke-width="2"/>
  <text x="290" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">2</text>
  <rect x="350" y="80" width="80" height="40" fill="#a3bef0" stroke="#2c3e50" stroke-width="2"/>
  <text x="390" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">3</text>
  <rect x="450" y="80" width="80" height="40" fill="#a3bef0" stroke="#2c3e50" stroke-width="2"/>
  <text x="490" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">4</text>
  <rect x="550" y="80" width="80" height="40" fill="#a3bef0" stroke="#2c3e50" stroke-width="2"/>
  <text x="590" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">5</text>
  <rect x="650" y="80" width="80" height="40" fill="#a3bef0" stroke="#2c3e50" stroke-width="2"/>
  <text x="690" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">6</text>
  <rect x="750" y="80" width="80" height="40" fill="#a3bef0" stroke="#2c3e50" stroke-width="2"/>
  <text x="790" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">7</text>

  <!-- Second Row: ASCII Codes (Hex) -->
  <text x="50" y="170" font-family="Arial" font-size="16" fill="#2c3e50">ASCII codes (hex)</text>
  <rect x="50" y="180" width="80" height="40" fill="#f0c4a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="90" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>
  <rect x="150" y="180" width="80" height="40" fill="#f0c4a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="190" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x31</text>
  <rect x="250" y="180" width="80" height="40" fill="#f0c4a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="290" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x32</text>
  <rect x="350" y="180" width="80" height="40" fill="#f0c4a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="390" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>
  <rect x="450" y="180" width="80" height="40" fill="#f0c4a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="490" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x34</text>
  <rect x="550" y="180" width="80" height="40" fill="#f0c4a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="590" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x35</text>
  <rect x="650" y="180" width="80" height="40" fill="#f0c4a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="690" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x36</text>
  <rect x="750" y="180" width="80" height="40" fill="#f0c4a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="790" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x37</text>

  <!-- Arrows to Branches -->
  <line x1="90" y1="220" x2="90" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="220" x2="190" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="220" x2="290" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="220" x2="390" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="220" x2="490" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="220" x2="590" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="220" x2="690" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="220" x2="790" y2="270" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch 1: Zero Lower 4 Bits -->
  <text x="50" y="290" font-family="Arial" font-size="16" fill="#2c3e50">Zero lower 4 bits (AND 0xF0)</text>
  <rect x="50" y="300" width="80" height="40" fill="#a3e4d7" stroke="#2c3e50" stroke-width="2"/>
  <text x="90" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>
  <rect x="150" y="300" width="80" height="40" fill="#a3e4d7" stroke="#2c3e50" stroke-width="2"/>
  <text x="190" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>
  <rect x="250" y="300" width="80" height="40" fill="#a3e4d7" stroke="#2c3e50" stroke-width="2"/>
  <text x="290" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>
  <rect x="350" y="300" width="80" height="40" fill="#a3e4d7" stroke="#2c3e50" stroke-width="2"/>
  <text x="390" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>
  <rect x="450" y="300" width="80" height="40" fill="#a3e4d7" stroke="#2c3e50" stroke-width="2"/>
  <text x="490" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>
  <rect x="550" y="300" width="80" height="40" fill="#a3e4d7" stroke="#2c3e50" stroke-width="2"/>
  <text x="590" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>
  <rect x="650" y="300" width="80" height="40" fill="#a3e4d7" stroke="#2c3e50" stroke-width="2"/>
  <text x="690" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>
  <rect x="750" y="300" width="80" height="40" fill="#a3e4d7" stroke="#2c3e50" stroke-width="2"/>
  <text x="790" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x30</text>

  <!-- Branch 2: Add 6 and Shift Right 4 -->
  <text x="50" y="410" font-family="Arial" font-size="16" fill="#2c3e50">Add 6, shift right 4</text>
  <rect x="50" y="420" width="80" height="40" fill="#f9a3a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="90" y="445" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x03</text>
  <rect x="150" y="420" width="80" height="40" fill="#f9a3a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="190" y="445" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x03</text>
  <rect x="250" y="420" width="80" height="40" fill="#f9a3a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="290" y="445" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x03</text>
  <rect x="350" y="420" width="80" height="40" fill="#f9a3a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="390" y="445" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x03</text>
  <rect x="450" y="420" width="80" height="40" fill="#f9a3a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="490" y="445" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x03</text>
  <rect x="550" y="420" width="80" height="40" fill="#f9a3a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="590" y="445" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x03</text>
  <rect x="650" y="420" width="80" height="40" fill="#f9a3a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="690" y="445" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x03</text>
  <rect x="750" y="420" width="80" height="40" fill="#f9a3a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="790" y="445" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x03</text>

  <!-- Arrows to OR Operation -->
  <line x1="90" y1="340" x2="90" y2="490" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="340" x2="190" y2="490" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="340" x2="290" y2="490" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="340" x2="390" y2="490" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="340" x2="490" y2="490" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="340" x2="590" y2="490" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="340" x2="690" y2="490" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="340" x2="790" y2="490" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="460" x2="90" y2="490" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="460" x2="190" y2="490" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="460" x2="290" y2="490" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="460" x2="390" y2="490" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="460" x2="490" y2="490" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="460" x2="590" y2="490" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="460" x2="690" y2="490" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="460" x2="790" y2="490" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final Row: OR Result -->
  <text x="50" y="510" font-family="Arial" font-size="16" fill="#2c3e50">OR result (hex)</text>
  <rect x="50" y="520" width="80" height="40" fill="#f7e1a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="90" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>
  <rect x="150" y="520" width="80" height="40" fill="#f7e1a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="190" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>
  <rect x="250" y="520" width="80" height="40" fill="#f7e1a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="290" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>
  <rect x="350" y="520" width="80" height="40" fill="#f7e1a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="390" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>
  <rect x="450" y="520" width="80" height="40" fill="#f7e1a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="490" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>
  <rect x="550" y="520" width="80" height="40" fill="#f7e1a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="590" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>
  <rect x="650" y="520" width="80" height="40" fill="#f7e1a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="690" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>
  <rect x="750" y="520" width="80" height="40" fill="#f7e1a3" stroke="#2c3e50" stroke-width="2"/>
  <text x="790" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">0x33</text>

  <!-- Arrowhead Definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
