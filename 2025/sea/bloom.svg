<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="150" fill="#f5f5f5"/>

  <!-- Title -->


  <!-- Bit array (16 bits) -->
  <g transform="translate(50, 80)">
    <!-- Draw bit array boxes -->
    <rect x="0" y="0" width="400" height="40" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Individual bit cells -->
    <rect x="0" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="25" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="50" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="75" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="100" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="125" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="150" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="175" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="200" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="225" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="250" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="275" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="300" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="325" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="350" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="375" y="0" width="25" height="40" fill="none" stroke="#000" stroke-width="1"/>

    <!-- Bit values (example: some bits set to 1) -->
    <text x="12.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="37.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">1</text>
    <text x="62.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="87.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="112.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">1</text>
    <text x="137.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="162.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="187.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">1</text>
    <text x="212.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="237.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="262.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">1</text>
    <text x="287.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="312.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="337.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">1</text>
    <text x="362.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    <text x="387.5" y="25" font-family="Arial" font-size="16" text-anchor="middle">0</text>

    <!-- Indices below the array -->
    <text x="12.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">0</text>
    <text x="37.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">1</text>
    <text x="62.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">2</text>
    <text x="87.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">3</text>
    <text x="112.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">4</text>
    <text x="137.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">5</text>
    <text x="162.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">6</text>
    <text x="187.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">7</text>
    <text x="212.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">8</text>
    <text x="237.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">9</text>
    <text x="262.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">10</text>
    <text x="287.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">11</text>
    <text x="312.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">12</text>
    <text x="337.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">13</text>
    <text x="362.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">14</text>
    <text x="387.5" y="60" font-family="Arial" font-size="12" text-anchor="middle">15</text>
  </g>

  <!-- Hash function lookups (arrows pointing to random indices) -->
  <g transform="translate(50, 80)">
    <!-- Hash 1: Points to index 4 -->
    <line x1="112.5" y1="-50" x2="112.5" y2="0" stroke="#553768" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="112.5" y="-60" font-family="Arial" font-size="14" text-anchor="middle" fill="#553768">Hash 1</text>

    <!-- Hash 2: Points to index 7 -->
    <line x1="187.5" y1="-50" x2="187.5" y2="0" stroke="#5d89a9" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="187.5" y="-60" font-family="Arial" font-size="14" text-anchor="middle" fill="#5d89a9">Hash 2</text>

    <!-- Hash 3: Points to index 10 -->
    <line x1="262.5" y1="-50" x2="262.5" y2="0" stroke="#afd5b9" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="262.5" y="-60" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Hash 3</text>
  </g>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>


</svg>
