<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Legend -->
  <rect x="650" y="40" width="15" height="15" fill="#1f77b4"/>
  <text x="670" y="50" font-family="Arial" font-size="16">Apple M4</text>
  <rect x="650" y="65" width="15" height="15" fill="#ff7f0e"/>
  <text x="670" y="75" font-family="Arial" font-size="16">Intel Ice Lake</text>

  <!-- First Chart: Instructions -->
  <!-- Title -->
  <text x="200" y="25" font-family="Arial" font-size="16" text-anchor="middle">Instructions</text>

  <!-- Axes -->
  <line x1="40" y1="300" x2="360" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="40" y1="50" x2="40" y2="300" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="25" y="50" font-family="Arial" font-size="16" text-anchor="end">250</text>
  <text x="25" y="125" font-family="Arial" font-size="16" text-anchor="end">150</text>
  <text x="25" y="225" font-family="Arial" font-size="16" text-anchor="end">50</text>
  <text x="25" y="300" font-family="Arial" font-size="16" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="150" y="320" font-family="Arial" font-size="16" text-anchor="middle">Apple M4</text>
  <text x="250" y="320" font-family="Arial" font-size="16" text-anchor="middle">Intel Ice Lake</text>

  <!-- Bars for Instructions -->
  <rect x="130" y="89" width="60" height="211" fill="#1f77b4"/>
  <rect x="230" y="109" width="60" height="191" fill="#ff7f0e"/>

  <!-- Second Chart: Instructions per Cycle -->
  <!-- Title -->
  <text x="600" y="25" font-family="Arial" font-size="16" text-anchor="middle">Instructions per cycle</text>

  <!-- Axes -->
  <line x1="440" y1="300" x2="760" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="440" y1="50" x2="440" y2="300" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="425" y="50" font-family="Arial" font-size="16" text-anchor="end">10</text>
  <text x="425" y="125" font-family="Arial" font-size="16" text-anchor="end">7.5</text>
  <text x="425" y="225" font-family="Arial" font-size="16" text-anchor="end">5</text>
  <text x="425" y="300" font-family="Arial" font-size="16" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="550" y="320" font-family="Arial" font-size="16" text-anchor="middle">Apple M4</text>
  <text x="650" y="320" font-family="Arial" font-size="16" text-anchor="middle">Intel Ice Lake</text>

  <!-- Bars for Instructions per Cycle -->
  <rect x="530" y="75" width="60" height="225" fill="#1f77b4"/>
  <rect x="630" y="150" width="60" height="150" fill="#ff7f0e"/>
</svg>
