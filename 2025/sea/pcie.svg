<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f5f5f5"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">PCI Express Bandwidth Comparison</text>
  
  <!-- PCIe 4.0 -->
  <rect x="50" y="350" width="100" height="50" fill="#4CAF50"/>
  <text x="100" y="330" text-anchor="middle" font-family="Arial" font-size="16">PCIe 4.0 (2011)</text>
  <text x="100" y="375" text-anchor="middle" font-family="Arial" font-size="16">31.5 GB/s</text>
  
  <!-- PCIe 5.0 -->
  <rect x="200" y="300" width="100" height="100" fill="#2196F3"/>
  <text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="16">PCIe 5.0 (2017)</text>
  <text x="250" y="325" text-anchor="middle" font-family="Arial" font-size="16">63 GB/s</text>
  
  <!-- PCIe 6.0 -->
  <rect x="350" y="250" width="100" height="150" fill="#FFC107"/>
  <text x="400" y="230" text-anchor="middle" font-family="Arial" font-size="16">PCIe 6.0 (2019)</text>
  <text x="400" y="275" text-anchor="middle" font-family="Arial" font-size="16">128 GB/s</text>
  
  <!-- PCIe 7.0 -->
  <rect x="500" y="200" width="100" height="200" fill="#F44336"/>
  <text x="550" y="180" text-anchor="middle" font-family="Arial" font-size="16">PCIe 7.0 (2022)</text>
  <text x="550" y="225" text-anchor="middle" font-family="Arial" font-size="16">242 GB/s</text>
  
</svg>
