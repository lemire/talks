<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" fill="#1c1c28" role="img" aria-labelledby="title desc">
  <title id="title">Sensorimotor skill</title>
  <desc id="desc">A robot arm tries to plug a USB-C cable into a slightly misaligned port and hits the edge again and again. A human feels the edge, nudges, and slides it in within one or two tries.</desc>
  <style>
    .serif { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-weight: 600; }
    .sans { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
    .muted { fill: #5c5c6b; }
  </style>
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0.5 L 9 5 L 0 9.5 Z" fill="#1baf7a"/>
    </marker>
  </defs>

  <rect width="1100" height="480" fill="#faf8f4"/>

  <!-- robot -->
  <rect x="20" y="20" width="510" height="350" rx="20" fill="#d5e5f8" stroke="#2a78d6" stroke-width="4"/>
  <text x="44" y="64" class="serif" font-size="34">robot arm</text>
  <!-- laptop side with port -->
  <rect x="400" y="100" width="110" height="170" rx="10" fill="#5c5c6b"/>
  <rect x="400" y="200" width="44" height="26" rx="6" fill="#1c1c28"/>
  <!-- failed attempts -->
  <g fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="6 5">
    <rect x="300" y="170" width="96" height="26" rx="8"/>
    <rect x="300" y="232" width="96" height="26" rx="8"/>
  </g>
  <rect x="300" y="218" width="96" height="26" rx="8" fill="#9aa3ad" stroke="#5c5c6b" stroke-width="3"/>
  <line x1="60" y1="231" x2="300" y2="231" stroke="#1c1c28" stroke-width="12" stroke-linecap="round"/>
  <g class="sans" font-size="30" font-weight="700" fill="#d6362b">
    <text x="364" y="166">✗</text>
    <text x="452" y="250" fill="#ffffff">✗</text>
    <text x="364" y="290">✗</text>
  </g>
  <text x="44" y="320" class="sans" font-size="24">tries 1, 2, 3, 4… scrapes the edge</text>
  <text x="44" y="352" class="sans muted" font-size="22">force ignored, then over-corrected</text>

  <!-- human -->
  <rect x="570" y="20" width="510" height="350" rx="20" fill="#d6f0e6" stroke="#1baf7a" stroke-width="4"/>
  <text x="594" y="64" class="serif" font-size="34">human hand</text>
  <rect x="950" y="100" width="110" height="170" rx="10" fill="#5c5c6b"/>
  <rect x="950" y="200" width="44" height="26" rx="6" fill="#1c1c28"/>
  <path d="M 610 260 C 680 262, 700 236, 740 244 S 790 222, 830 230 S 870 212, 900 213" fill="none" stroke="#1baf7a" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#arr-green)"/>
  <rect x="900" y="200" width="96" height="26" rx="8" fill="#9aa3ad" stroke="#5c5c6b" stroke-width="3"/>
  <text x="1005" y="180" class="sans" font-size="40" font-weight="700" fill="#1baf7a">✓</text>
  <text x="594" y="320" class="sans" font-size="24">feel the edge, nudge, slide in</text>
  <text x="594" y="352" class="sans muted" font-size="22">one or two tries</text>

  <text x="550" y="430" text-anchor="middle" class="serif" font-size="32">It sees the port and plans the motion. It cannot feel and correct.</text>
</svg>
