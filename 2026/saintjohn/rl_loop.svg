<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="1140" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Reinforcement learning</title>
  <desc id="desc">A loop: the model acts in an environment, the trajectory (patch, proof, tool calls) goes to a verifier, and the verifier's reward updates the model's weights.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0.5 L 9 5 L 0 9.5 Z" fill="#2a78d6"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0.5 L 9 5 L 0 9.5 Z" fill="#eb6834"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0.5 L 9 5 L 0 9.5 Z" fill="#1baf7a"/>
    </marker>
  </defs>

  <rect width="1140" height="500" fill="#faf8f4"/>

  <!-- model -->
  <g transform="translate(20, 60)">
    <rect width="260" height="200" rx="24" fill="#d5e5f8" stroke="#2a78d6" stroke-width="5"/>
    <text x="130" y="95" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="42" font-weight="600" fill="#1c1c28">model</text>
    <text x="130" y="150" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#5c5c6b">the weights</text>
  </g>

  <!-- environment -->
  <g transform="translate(440, 60)">
    <rect width="260" height="200" rx="24" fill="#fbe1d6" stroke="#eb6834" stroke-width="5"/>
    <text x="130" y="95" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="38" font-weight="600" fill="#1c1c28">environment</text>
    <text x="130" y="150" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#5c5c6b">patch, proof, tools</text>
  </g>

  <!-- verifier -->
  <g transform="translate(860, 60)">
    <rect width="260" height="200" rx="24" fill="#d6f0e6" stroke="#1baf7a" stroke-width="5"/>
    <text x="130" y="95" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="42" font-weight="600" fill="#1c1c28">verifier</text>
    <text x="130" y="150" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#5c5c6b">tests pass? correct?</text>
  </g>

  <!-- model -> environment: acts -->
  <line x1="286" y1="160" x2="428" y2="160" stroke="#2a78d6" stroke-width="7" marker-end="url(#arr-blue)"/>
  <text x="356" y="138" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="30" font-weight="500" fill="#1c1c28">acts</text>

  <!-- environment -> verifier: trajectory -->
  <line x1="706" y1="160" x2="848" y2="160" stroke="#eb6834" stroke-width="7" marker-end="url(#arr-orange)"/>
  <text x="776" y="204" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" fill="#eb6834">trajectory</text>

  <!-- verifier -> model: reward updates the weights -->
  <path d="M 990 268 C 990 430, 800 430, 570 430 C 340 430, 150 430, 150 280" fill="none" stroke="#1baf7a" stroke-width="7" marker-end="url(#arr-green)"/>
  <text x="570" y="410" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="30" font-weight="500" fill="#1c1c28">weights += learn(reward)</text>
  <text x="570" y="478" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" fill="#1baf7a">reward · reinforce what worked</text>
</svg>
