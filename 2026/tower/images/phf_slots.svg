<rect x="844" y="180" width="66" height="66" rx="6" fill="#e6e6e3" stroke="white" stroke-width="1.5" />
<text x="877.0" y="270" font-size="18" fill="#8a8985" text-anchor="middle" >2</text>
<rect x="916" y="180" width="66" height="66" rx="6" fill="#2a78d6" stroke="white" stroke-width="1.5" />
<text x="949.0" y="218.4" font-size="15" fill="white" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace" >GET</text>
<text x="949.0" y="270" font-size="18" fill="#8a8985" text-anchor="middle" >3</text>
<rect x="988" y="180" width="66" height="66" rx="6" fill="#1baf7a" stroke="white" stroke-width="1.5" />
<text x="1021.0" y="218.4" font-size="15" fill="white" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace" >PUT</text>
<text x="1021.0" y="270" font-size="18" fill="#8a8985" text-anchor="middle" >4</text>
<rect x="1060" y="180" width="66" height="66" rx="6" fill="#4a3aa7" stroke="white" stroke-width="1.5" />
<text x="1093.0" y="218.4" font-size="15" fill="white" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace" >POST</text>
<text x="1093.0" y="270" font-size="18" fill="#8a8985" text-anchor="middle" >5</text>
<rect x="1132" y="180" width="66" height="66" rx="6" fill="#e87ba4" stroke="white" stroke-width="1.5" />
<text x="1165.0" y="218.4" font-size="15" fill="white" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace" >DELETE</text>
<text x="1165.0" y="270" font-size="18" fill="#8a8985" text-anchor="middle" >6</text>
<rect x="1204" y="180" width="66" height="66" rx="6" fill="#e6e6e3" stroke="white" stroke-width="1.5" />
<text x="1237.0" y="270" font-size="18" fill="#8a8985" text-anchor="middle" >7</text>
<rect x="700" y="330" width="130" height="48" rx="6" fill="#0b0b0b" stroke="white" stroke-width="1.5" />
<text x="765.0" y="361.92" font-size="22" fill="white" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace" >PUT</text>
<text x="848" y="362" font-size="22" fill="#0b0b0b" text-anchor="start" font-family="Menlo, Consolas, monospace" >→ 3 + 1 = slot 4</text>
<path d="M800,330 V290 H1021.0 V280" stroke="#1baf7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,5"/>
<text x="848" y="400" font-size="20" fill="#008300" text-anchor="start" >"PUT" == "PUT"?  yes: return the value</text>
<rect x="700" y="450" width="130" height="48" rx="6" fill="#0b0b0b" stroke="white" stroke-width="1.5" />
<text x="765.0" y="481.92" font-size="22" fill="white" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace" >PATCH</text>
<text x="848" y="482" font-size="22" fill="#0b0b0b" text-anchor="start" font-family="Menlo, Consolas, monospace" >→ 5 + 1 = slot 6</text>
<path d="M730,450 V308 H1165.0 V280" stroke="#eb6834" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,5"/>
<text x="848" y="520" font-size="20" fill="#eb6834" text-anchor="start" >"PATCH" == "DELETE"?  no: not in the set</text>
<text x="700" y="580" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="bold" >one hash, one comparison, no probing, no chain</text>
