
 <svg width="1200" height="600" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <style>
   .bar-cycles { fill: #1f77b4; }
   .bar-instructions { fill: #ff7f0e; }
   .bar-inscycle { fill: #2ca02c; }
   .bar-label { font: 18px sans-serif; text-anchor: middle; }
   .axis-text { font: 20px sans-serif; }
   .title { font: 24px sans-serif; font-weight: bold; }
  </style>

  <text x="180" y="520" class="title" text-anchor="middle">Cycles</text>
  <text x="50" y="450" class="axis-text">0</text>
  <text x="50" y="380" class="axis-text">1</text>
  <text x="50" y="310" class="axis-text">2</text>
  <text x="125" y="480" class="axis-text" text-anchor="middle">Successive difference</text>
  <text x="275" y="480" class="axis-text" text-anchor="middle">Prefix sum</text>
  <rect x="100" y="380" width="70" height="70" class="bar-cycles" />
  <text x="135" y="365" class="bar-label">1</text>
  <rect x="250" y="380" width="70" height="70" class="bar-cycles" />
  <text x="285" y="365" class="bar-label">1</text>

  <text x="600" y="520" class="title" text-anchor="middle">Instructions</text>
  <text x="420" y="450" class="axis-text">0</text>
  <text x="420" y="380" class="axis-text">1</text>
  <text x="420" y="310" class="axis-text">2</text>
  <text x="420" y="240" class="axis-text">3</text>
  <text x="420" y="170" class="axis-text">4</text>
  <text x="420" y="100" class="axis-text">5</text>
  <text x="420" y="30" class="axis-text">6</text>
  <text x="525" y="480" class="axis-text" text-anchor="middle">Successive difference</text>
  <text x="675" y="480" class="axis-text" text-anchor="middle">Prefix sum</text>
  <rect x="470" y="30" width="70" height="420" class="bar-instructions" />
  <text x="505" y="15" class="bar-label">6</text>
  <rect x="650" y="100" width="70" height="350" class="bar-instructions" />
  <text x="685" y="85" class="bar-label">5</text>

  <text x="1020" y="520" class="title" text-anchor="middle">Instructions per cycle</text>
  <text x="840" y="450" class="axis-text">0</text>
  <text x="840" y="380" class="axis-text">1</text>
  <text x="840" y="310" class="axis-text">2</text>
  <text x="840" y="240" class="axis-text">3</text>
  <text x="840" y="170" class="axis-text">4</text>
  <text x="840" y="100" class="axis-text">5</text>
  <text x="840" y="30" class="axis-text">6</text>
  <text x="945" y="480" class="axis-text" text-anchor="middle">Successive difference</text>
  <text x="1095" y="480" class="axis-text" text-anchor="middle">Prefix sum</text>
  <rect x="890" y="30" width="70" height="420" class="bar-inscycle" />
  <text x="925" y="15" class="bar-label">6</text>
  <rect x="1070" y="100" width="70" height="350" class="bar-inscycle" />
  <text x="1105" y="85" class="bar-label">5</text>
 </svg>
