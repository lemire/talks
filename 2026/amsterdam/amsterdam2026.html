<!DOCTYPE html><html lang="C"><head><title>SIMD-accelerated data processing</title><meta property="og:title" content="SIMD-accelerated data processing"><meta name="description" content="Hardware capabilities have advanced dramatically, with PCIe bandwidth doubling roughly every three years, reaching 32 GB/s per channel in PCIe 7.0, high-bandwidth memory delivering hundreds of GB/s, and modern CPUs featuring wider SIMD units capable of processing dozens of bytes per instruction. Yet many software tasks, including JSON parsing, remain CPU-bound and far slower than these interfaces allow. This presentation explores how SIMD instructions enable gigabyte-per-second throughput in real-world data processing. Focusing on the simdjson library, we examine its design for fast structural scanning, on-demand parsing, and minification, along with recent optimizations leveraging C++26 compile-time reflection for efficient serialization and vectorized string escaping. We extend the discussion to related challenges in Unicode validation and correction (as deployed in browsers) and high-speed Base64 encoding/decoding in upcoming JavaScript standards. Through benchmarks on platforms, we demonstrate how these techniques harness modern hardware to deliver orders-of-magnitude speedups, powering systems from Node.js and ClickHouse to web browsers worldwide."><meta property="og:description" content="Hardware capabilities have advanced dramatically, with PCIe bandwidth doubling roughly every three years, reaching 32 GB/s per channel in PCIe 7.0, high-bandwidth memory delivering hundreds of GB/s, and modern CPUs featuring wider SIMD units capable of processing dozens of bytes per instruction. Yet many software tasks, including JSON parsing, remain CPU-bound and far slower than these interfaces allow. This presentation explores how SIMD instructions enable gigabyte-per-second throughput in real-world data processing. Focusing on the simdjson library, we examine its design for fast structural </foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" lang="C" data-marpit-pagination="9" style="" data-marpit-pagination-total="40" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-fragments="5" data-paginate="true" lang="C" data-marpit-pagination="10" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="usage">Usage</h1>
<p><strong>You are probably using simdjson:</strong></p>
<ul>
<li>Node.js, Electron,...</li>
<li>ClickHouse</li>
<li>WatermelonDB, Apache Doris, Meta Velox, Milvus,  QuestDB,  StarRocks</li>
</ul>
<p><img src="images/nodejs.jpg" width="20%" /> <img src="images/clickhouse.jpg" width="20%" /></p>
<h1 id="simdjson-design">simdjson: Design</h1>
<ul>
<li data-marpit-fragment="1">First scan identifies the structural characters, start of all strings at about 10 GB/s using SIMD instructions.</li>
<li data-marpit-fragment="2">Validates Unicode at 30 GB/s.</li>
<li data-marpit-fragment="3">Rest of parsing relies on the generated index.</li>
<li data-marpit-fragment="4">Allows fast skipping. (Only parse what we need)</li>
<li data-marpit-fragment="5">Can minify JSON at 10 to 20 GB/s</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" lang="C" data-marpit-pagination="11" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="classifying-characters">Classifying characters</h1>
<ul>
<li>comma (0x2c) <code>,</code></li>
<li>colon (0x3a) <code>:</code></li>
<li>brackets (0x5b,0x5d, 0x7b, 0x7d): <code>[, ], {, }</code></li>
<li>white-space (0x09, 0x0a, 0x0d, 0x20)</li>
<li>others</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="4" data-paginate="true" lang="C" data-marpit-pagination="12" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="vectorized-classification">Vectorized classification</h1>
<ul>
<li data-marpit-fragment="1">Most SIMD ISAs support 'vectorized lookup tables' (at least 16-element)</li>
<li data-marpit-fragment="2">If we had 256-element tables, we could do <code>H(c)</code>.</li>
<li data-marpit-fragment="3">For 16-element tables, need two tables <code>H1</code>and <code>H2</code>.</li>
<li data-marpit-fragment="4">Find two tables <code>H1</code> and <code>H2</code> such as the bitwise AND of the look classify the characters: <code>H1(low(&amp; 0xf) &amp; H2(c &gt;&gt; 4)</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" lang="C" data-marpit-pagination="13" style="--paginate:true;" data-marpit-pagination-total="40">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-C">low_nibble_mask = {<span class="hljs-number">16</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">8</span>, <span class="hljs-number">12</span>, <span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">9</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>};
high_nibble_mask = {<span class="hljs-number">8</span>, <span class="hljs-number">0</span>, <span class="hljs-number">18</span>, <span class="hljs-number">4</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">3</span>, <span class="hljs-number">2</span>, <span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>};
</code></pre>
<p>Five instructions:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-C">    nib_lo = input &amp; <span class="hljs-number">0xf</span>;
    nib_hi = input &gt;&gt; <span class="hljs-number">4</span>;
    shuf_lo = lookup(low_nibble_mask, nib_lo);
    shuf_hi = lookup(high_nibble_mask, nib_hi);
    <span class="hljs-keyword">return</span> shuf_lo &amp; shuf_hi;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" lang="C" data-marpit-pagination="14" style="--paginate:true;" data-marpit-pagination-total="40">
<ul>
<li>comma (0x2c): 1</li>
<li>colon (0x3a): 2</li>
<li>brackets (0x5b,0x5d, 0x7b, 0x7d): 4</li>
<li>most white-space (0x09, 0x0a, 0x0d): 8</li>
<li>white space (0x20): 16</li>
<li>others: 0</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" lang="C" data-marpit-pagination="15" style="--paginate:true;" data-marpit-pagination-total="40">

<h1 id="optimization-1-consteval">Optimization #1: Consteval</h1>
<h2 id="the-power-of-compile-time">The Power of Compile-Time</h2>
<p><strong>The Insight:</strong> JSON field names are known at compile time!</p>
<p><strong>Traditional (Runtime):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// Every serialization call:</span>
<span class="hljs-built_in">write_string</span>(<span class="hljs-string">&quot;\&quot;username\&quot;&quot;</span>);  <span class="hljs-comment">// Quote &amp; escape at runtime</span>
<span class="hljs-built_in">write_string</span>(<span class="hljs-string">&quot;\&quot;level\&quot;&quot;</span>);     <span class="hljs-comment">// Quote &amp; escape again!</span>
</code></pre>
<p><strong>With Consteval (Compile-Time):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">constexpr</span> <span class="hljs-keyword">auto</span> username_key = <span class="hljs-string">&quot;\&quot;username\&quot;:&quot;</span>;  <span class="hljs-comment">// Pre-computed!</span>
b.<span class="hljs-built_in">append_literal</span>(username_key);  <span class="hljs-comment">// Just memcpy!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" lang="C" data-marpit-pagination="18" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="optimization-2-simd-string-escaping">Optimization #2: SIMD String Escaping</h1>
<p><strong>The Problem:</strong> JSON requires escaping <code>&quot;</code>, <code>\</code>, and control chars</p>
<p><strong>Traditional (1 byte at a time):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">char</span> c : str) {
    <span class="hljs-keyword">if</span> (c == <span class="hljs-string">&#x27;&quot;&#x27;</span> || c == <span class="hljs-string">&#x27;\\&#x27;</span> || c &lt; <span class="hljs-number">0x20</span>)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
}
</code></pre>
<p><strong>SIMD (16 bytes at once):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">auto</span> chunk = <span class="hljs-built_in">load_16_bytes</span>(str);
<span class="hljs-keyword">auto</span> needs_escape = <span class="hljs-built_in">check_all_conditions_parallel</span>(chunk);
<span class="hljs-keyword">if</span> (!needs_escape)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;  <span class="hljs-comment">// Fast path!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" lang="C" data-marpit-pagination="19" style="--paginate:true;" data-marpit-pagination-total="40">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="3" data-paginate="true" lang="C" data-marpit-pagination="20" style="--paginate:true;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;simdutf.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="20" data-marpit-fragments="3" data-paginate="true" lang="C" data-marpit-pagination="20" style="--paginate:true;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<ul>
<li data-marpit-fragment="1">Part of Safari, Chrome, and most browsers</li>
<li data-marpit-fragment="2">Process Unicode and Base64 formats at gigabytes per second</li>
<li data-marpit-fragment="3">Support LoongArch, x64, ARM, POWER, RISC-V</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="3" data-paginate="true" lang="C" data-marpit-pagination="20" style="" data-marpit-pagination-total="40" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="2" data-paginate="true" lang="C" data-marpit-pagination="21" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="unicode-utf-16">Unicode (UTF-16)</h1>
<ul>
<li data-marpit-fragment="1">Code points from U+0000 to U+FFFF, a single 16-bit value.</li>
<li data-marpit-fragment="2">Beyond: a surrogate pair <code>[U+D800 to U+DBFF]</code> followed by <code>U+DC00 to U+DFFF</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-fragments="2" data-paginate="true" lang="C" data-marpit-pagination="22" style="--paginate:true;" data-marpit-pagination-total="40">

<h1 id="validate-1">Validate</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-variable constant_">PROCEDURE</span> <span class="hljs-title function_">validate_utf16</span>(code_units)
    i ← <span class="hljs-number">0</span>
    <span class="hljs-variable constant_">WHILE</span> i &lt; |code_units|
        unit ← code_units[i]
        <span class="hljs-variable constant_">IF</span> unit ≤ <span class="hljs-number">0xD7FF</span> <span class="hljs-variable constant_">OR</span> unit ≥ <span class="hljs-number">0xE000</span> <span class="hljs-variable constant_">THEN</span>
            <span class="hljs-variable constant_">INCREMENT</span> i
            <span class="hljs-variable constant_">CONTINUE</span>
        <span class="hljs-variable constant_">IF</span> unit ≥ <span class="hljs-number">0xD800</span> <span class="hljs-variable constant_">AND</span> unit ≤ <span class="hljs-number">0xDBFF</span> <span class="hljs-variable constant_">THEN</span>
            <span class="hljs-variable constant_">IF</span> i + <span class="hljs-number">1</span> ≥ |code_units| <span class="hljs-variable constant_">THEN</span>
                <span class="hljs-variable constant_">RETURN</span> <span class="hljs-literal">false</span>
            next_unit ← code_units[i + <span class="hljs-number">1</span>]
            <span class="hljs-variable constant_">IF</span> next_unit &lt; <span class="hljs-number">0xDC00</span> <span class="hljs-variable constant_">OR</span> next_unit &gt; <span class="hljs-number">0xDFFF</span> <span class="hljs-variable constant_">THEN</span>
                <span class="hljs-variable constant_">RETURN</span> <span class="hljs-literal">false</span>
            i ← i + <span class="hljs-number">2</span>  <span class="hljs-comment">// Valid surrogate pair</span>
            <span class="hljs-variable constant_">CONTINUE</span>
        <span class="hljs-variable constant_">RETURN</span> <span class="hljs-literal">false</span>
    <span class="hljs-variable constant_">RETURN</span> <span class="hljs-literal">true</span>
</code></pre>

<h1 id="base64">Base64</h1>
<ul>
<li>Encodes binary data to text using 64 characters (A-Z, a-z, 0-9, +, /)</li>
<li>3 bytes input → 4 characters output (33% overhead)</li>
<li>Used in data URLs, email, web APIs</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" lang="C" data-marpit-pagination="27" style="--paginate:true;" data-marpit-pagination-total="40">
<h1 id="new-javascript-functions">New JavaScript functions</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javasript">const b64 = Uint8Array.toBase64(bytes);      // string          
const recovered = Uint8Array.fromBase64(b64); // Uint8Array, matches original 'bytes'
</code></pre>
<ul>
<li>SIMD accelerates encoding/decoding to gigabytes per second</li>
<li>Part of simdutf: fast, portable implementations</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" lang="C" data-marpit-pagination="28" style="--paginate:true;" data-marpit-pagination-total="40">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Uint8Array.fromBase64()          0.00292 ms (±0.88%) → 10716.22 MiB/s
Uint8Array.fromBase64() (line breaks) 0.00499 ms (±41.96%) → 6266.53 MiB/s
Uint8Array.toBase64()            0.00154 ms (±1.19%) → 20247.26 MiB/s
</code></pre>
<p>Test in your browser at <a href="https://simdutf.github.io/browserbase64/">https://simdutf.github.io/browserbase64/</a></p>

<li data-marpit-fragment="1">You cannot assume normality</li>
<li data-marpit-fragment="2">Measurements are <strong>not independent</strong>.</li>
<li data-marpit-fragment="3">Reality: the absolute minimum is often a <em>reliable metric</em></li>
<li data-marpit-fragment="4">Margin: difference between mean and minimum</li>
</ul>
</section>

<ul>
<li data-marpit-fragment="1">Processors are getting much better! Wider!</li>
<li data-marpit-fragment="2">'hot spot' engineering can fail, better to reduce overall instruction count.</li>
<li data-marpit-fragment="3">Branchy code can do well in synthetic benchmarks, but be careful.</li>
</ul>
