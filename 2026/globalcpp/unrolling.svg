<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" font-family="Arial">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Apple M4 Bar Chart -->
  <text x="20" y="30" font-size="20" font-weight="bold">Apple M4</text>
  
  <!-- Instructions -->
  <rect x="50" y="60" width="100" height="120" fill="#4CAF50"/>
  <rect x="170" y="100" width="100" height="80" fill="#81C784"/>
  <text x="50" y="50" font-size="16">Instructions</text>
  <text x="75" y="195" font-size="16">Regular: 6</text>
  <text x="195" y="195" font-size="16">Unrolled: 3.5</text>
  
  <!-- Cycles -->
  <rect x="310" y="100" width="100" height="80" fill="#FF9800"/>
  <rect x="430" y="110" width="100" height="70" fill="#FFB74D"/>
  <text x="310" y="50" font-size="16">Cycles</text>
  <text x="335" y="195" font-size="16">Regular: 1.2</text>
  <text x="455" y="195" font-size="16">Unrolled: 1.0</text>

  <!-- Intel Ice Lake Bar Chart -->
  <text x="20" y="230" font-size="20" font-weight="bold">Intel Ice Lake</text>
  
  <!-- Instructions -->
  <rect x="50" y="260" width="100" height="140" fill="#F44336"/>
  <rect x="170" y="300" width="100" height="100" fill="#E57373"/>
  <text x="50" y="250" font-size="16">Instructions</text>
  <text x="75" y="415" font-size="16">Regular: 7</text>
  <text x="195" y="415" font-size="16">Unrolled: 5</text>
  
  <!-- Cycles -->
  <rect x="310" y="250" width="100" height="150" fill="#FFEB3B"/>
  <rect x="430" y="290" width="100" height="110" fill="#FFF176"/>
  <text x="310" y="250" font-size="16">Cycles</text>
  <text x="335" y="415" font-size="16">Regular: 1.6</text>
  <text x="455" y="415" font-size="16">Unrolled: 1.1</text>
</svg>
