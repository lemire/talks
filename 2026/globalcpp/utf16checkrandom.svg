<svg width="1200" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Legend -->
  <rect x="1050" y="30" width="15" height="15" fill="#1f77b4"/>
  <text x="1070" y="40" font-family="Arial" font-size="12">ASCII</text>
  <rect x="1050" y="55" width="15" height="15" fill="#ff7f0e"/>
  <text x="1070" y="65" font-family="Arial" font-size="12">Alternate</text>
  <rect x="1050" y="80" width="15" height="15" fill="#2ca02c"/>
  <text x="1070" y="90" font-family="Arial" font-size="12">Random</text>

  <!-- First Chart: Cycles -->
  <!-- Title -->
  <text x="200" y="25" font-family="Arial" font-size="22" text-anchor="middle">Cycles</text>

  <!-- Axes -->
  <line x1="40" y1="300" x2="360" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="40" y1="50" x2="40" y2="300" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="25" y="50" font-family="Arial" font-size="16" text-anchor="end">8</text>
  <text x="25" y="125" font-family="Arial" font-size="16" text-anchor="end">6</text>
  <text x="25" y="225" font-family="Arial" font-size="16" text-anchor="end">2</text>
  <text x="25" y="300" font-family="Arial" font-size="16" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="110" y="320" font-family="Arial" font-size="16" text-anchor="middle">ASCII</text>
  <text x="200" y="320" font-family="Arial" font-size="16" text-anchor="middle">Alternate</text>
  <text x="290" y="320" font-family="Arial" font-size="16" text-anchor="middle">Random</text>

  <!-- Bars for Cycles -->
  <rect x="90" y="262.5" width="50" height="37.5" fill="#1f77b4"/>
  <rect x="180" y="262.5" width="50" height="37.5" fill="#ff7f0e"/>
  <rect x="270" y="50" width="50" height="250" fill="#2ca02c"/>

  <!-- Second Chart: Instructions -->
  <!-- Title -->
  <text x="600" y="25" font-family="Arial" font-size="22" text-anchor="middle">Instructions</text>

  <!-- Axes -->
  <line x1="440" y1="300" x2="760" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="440" y1="50" x2="440" y2="300" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="425" y="50" font-family="Arial" font-size="16" text-anchor="end">10</text>
  <text x="425" y="125" font-family="Arial" font-size="16" text-anchor="end">8</text>
  <text x="425" y="225" font-family="Arial" font-size="16" text-anchor="end">6</text>
  <text x="425" y="300" font-family="Arial" font-size="16" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="510" y="320" font-family="Arial" font-size="16" text-anchor="middle">ASCII</text>
  <text x="600" y="320" font-family="Arial" font-size="16" text-anchor="middle">Alternate</text>
  <text x="690" y="320" font-family="Arial" font-size="16" text-anchor="middle">Random</text>

  <!-- Bars for Instructions -->
  <rect x="490" y="112.5" width="50" height="187.5" fill="#1f77b4"/>
  <rect x="580" y="75" width="50" height="225" fill="#ff7f0e"/>
  <rect x="670" y="75" width="50" height="225" fill="#2ca02c"/>

  <!-- Third Chart: Instructions per Cycle -->
  <!-- Title -->
  <text x="1000" y="25" font-family="Arial" font-size="22" text-anchor="middle">Instructions per cycle</text>

  <!-- Axes -->
  <line x1="840" y1="300" x2="1160" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="840" y1="50" x2="840" y2="300" stroke="#000" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="825" y="50" font-family="Arial" font-size="16" text-anchor="end">10</text>
  <text x="825" y="125" font-family="Arial" font-size="16" text-anchor="end">8</text>
  <text x="825" y="225" font-family="Arial" font-size="16" text-anchor="end">6</text>
  <text x="825" y="300" font-family="Arial" font-size="16" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="910" y="320" font-family="Arial" font-size="16" text-anchor="middle">ASCII</text>
  <text x="1000" y="320" font-family="Arial" font-size="16" text-anchor="middle">Alternate</text>
  <text x="1090" y="320" font-family="Arial" font-size="16" text-anchor="middle">Random</text>

  <!-- Bars for Instructions per Cycle -->
  <rect x="890" y="112.5" width="50" height="187.5" fill="#1f77b4"/>
  <rect x="980" y="75" width="50" height="225" fill="#ff7f0e"/>
  <rect x="1070" y="258.75" width="50" height="41.25" fill="#2ca02c"/>
</svg>
